<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUMAA AI - Parenting Companion</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #FF6B6B 0%, #FF8E8E 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: 20px;
        }
        .emoji {
            font-size: 80px;
        }
        h1 {
            color: #FF6B6B;
            font-size: 48px;
            margin: 20px 0 10px;
        }
        p {
            color: #666;
            font-size: 16px;
            line-height: 1.6;
        }
        .button {
            background: #FF6B6B;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 20px;
        }
        .features {
            text-align: left;
            margin-top: 30px;
        }
        .feature {
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">🤱</div>
        <h1>MUMAA AI</h1>
        <p>Your AI-Powered Parenting Companion</p>
        
        <button class="button" onclick="alert('MUMAA AI: Namaste! How can I help you today?')">
            Tap to Chat
        </button>
        
        <div class="features">
            <div class="feature">🍼 AI Cry Translator</div>
            <div class="feature">📊 Developmental Milestones (0-5 years)</div>
            <div class="feature">💬 24/7 Hinglish AI Support</div>
            <div class="feature">🚨 Emergency Helplines: 1098, 108, 181</div>
            <div class="feature">✨ Daily Parenting Tips</div>
        </div>
        
        <p style="font-size: 12px; margin-top: 30px; color: #999;">
            Made with ❤️ for Indian Parents
        </p>
    </div>
</body>
</html>
